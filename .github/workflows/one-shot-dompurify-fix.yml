name: One-shot DOMPurify security fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-dompurify-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  fix-and-release:
    if: github.repository == 'atoz03/Netcatty'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: v1.1.80
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Pin patched DOMPurify
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = pkg.overrides || {};
          pkg.overrides.dompurify = '3.4.14';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Validate install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Require clean npm audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/npm-audit.json || {
            cp /tmp/npm-audit.json .github/security-audit-result.json
            echo "npm audit is still non-zero." >&2
            exit 1
          }
          rm -f .github/security-audit-result.json

      - name: Commit final security fix and remove helper
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-dompurify-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package.json package-lock.json .github/security-audit-result.json .github/workflows/one-shot-dompurify-fix.yml
          git commit -m "chore(security): pin patched DOMPurify"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}" || git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi
          git tag -a "${RELEASE_TAG}" -m "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Start release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "${RELEASE_TAG}" -f publish_release=true
