name: One-shot security dependency finalize

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-security-finalize.yml

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    if: github.repository == 'atoz03/Netcatty'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: v1.1.80
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Apply security dependency upgrades
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies['monaco-editor'] = '^0.56.0';
          pkg.devDependencies['wait-on'] = '^9.1.0';
          delete pkg.optionalDependencies['@cursor/sdk'];
          pkg.overrides.axios = '1.19.0';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true

      - name: Validate install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Final npm audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit.json
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            cp /tmp/npm-audit.json .github/security-audit-result.json
          else
            rm -f .github/security-audit-result.json
          fi

      - name: Commit security fixes and remove helper
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-security-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package.json package-lock.json .github/security-audit-result.json .github/workflows/one-shot-security-finalize.yml
          git commit -m "chore(security): resolve npm audit findings"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refuse release if audit is not clean
        if: steps.audit.outputs.rc != '0'
        run: |
          echo "npm audit is still non-zero; release tag was not created." >&2
          exit 1

      - name: Create release tag
        if: steps.audit.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}" || git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi
          git tag -a "${RELEASE_TAG}" -m "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Start release build
        if: steps.audit.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "${RELEASE_TAG}" -f publish_release=true
